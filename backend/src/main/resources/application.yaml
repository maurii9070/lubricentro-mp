spring:
  application:
    name: lubricentro-mp-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lubricentro_mp}
    username: ${DB_USER:dev_user}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: ${SHOW_SQL:true}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

lubricentro:
  name: "Lubricentro MP"
  excel:
    path: ${EXCEL_PATH:../data/STOCK_MP_ESCRITORIO.xlsx}

server:
  port: ${PORT:8080}